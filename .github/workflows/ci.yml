name: ci

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned, checksum verified)
        run: |
          curl -sSfL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz
          echo "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks
      - name: Scan the whole tree and the history
        run: |
          ./gitleaks dir . --no-banner --redact
          ./gitleaks git . --no-banner --redact
      # Product words, personal data and local paths, over every commit (the pull request's title and body are checked by
      # pr-gate.yml, which also runs when they are edited). The word list is the Actions secret SCAN_WORDS:
      # it is read only in this step, written to a temp file, never echoed, and the script prints only
      # a rule name, a short commit id and counts (the logs of a public repository are public).
      # The trigger is `pull_request`, never `pull_request_target`, so a fork's workflow never receives the secret.
      - name: Scan every commit for product words, personal data and local paths
        env:
          SCAN_WORDS: ${{ secrets.SCAN_WORDS }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork == true }}
        run: |
          words="$RUNNER_TEMP/scan-words"
          umask 077
          if [ "$IS_FORK" = "true" ]; then
            echo "fork pull request: the word list is not available; only the generic checks run"
          else
            # A missing list must stop the scan, never read as "no hits": the script is told the list is required.
            [ -n "$SCAN_WORDS" ] || { echo "SCAN_WORDS is not set"; exit 1; }
            printf '%s\n' "$SCAN_WORDS" > "$words"
            export SCAN_WORDS_FILE="$words" SCAN_REQUIRE_WORDS=1
          fi
          sh scripts/scan-public.sh
          rm -f "$words"

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm --prefix legacy/spec-tools ci
      - run: npm --prefix docs ci
      - run: npm run typecheck:framework
      - run: npm run lint:framework
      - run: npm run typecheck:spec-tools
      - run: npm run lint:spec-tools
      - run: npm run check:fence
      - run: npm run test:bin
      - run: npm run verify -- --fail-on-unclassified
      - run: npm run test:unit
      - run: npm run test:spec-tools
